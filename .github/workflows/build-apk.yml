name: Build NadScan V1.2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadScan_Android_V1_2_SAFE_AREA_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build NadScan V1.2
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadScan V1.2 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadScan_Android_V1_2_SAFE_AREA_FIX.zip"

          echo "========================================"
          echo "NADSCAN V1.2"
          echo "ICON + CAMERA + SAFE AREA"
          echo "========================================"
          echo ""

          echo "Repository contents:"
          ls -lah
          echo ""

          if [ ! -f "$ZIP" ]; then
            echo "ERROR:"
            echo "$ZIP was not found."
            echo ""
            echo "Required exact filename:"
            echo "NadScan_Android_V1_2_SAFE_AREA_FIX.zip"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadScan V1.2
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadScan_Android_V1_2_SAFE_AREA_FIX.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED PACKAGE"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -350

      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          EXPECTED="extracted/NadScan_Android_V1_2_SAFE_AREA_FIX"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            PROJECT_ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            PROJECT_ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1 || true)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "Could not locate Android project."
              echo ""
              find extracted -maxdepth 6 -type d | sort
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT ROOT"
          echo "========================================"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "settings.gradle.kts FOUND"
          echo "build.gradle.kts FOUND"
          echo "app/build.gradle.kts FOUND"
          echo "AndroidManifest.xml FOUND"

      # ==========================================
      # 8. VERIFY APP ID
      # ==========================================
      - name: Verify NadScan application ID
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "APPLICATION ID"
          echo "========================================"

          if ! grep -q 'applicationId = "ae.nadscan.app"' "$FILE"; then
            echo "ERROR:"
            echo "Expected application ID not found."
            cat "$FILE"
            exit 1
          fi

          echo "Application ID verified:"
          echo "ae.nadscan.app"

      # ==========================================
      # 9. VERIFY VERSION 1.2
      # ==========================================
      - name: Verify NadScan V1.2
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -q 'versionCode = 3' "$FILE"; then
            echo "ERROR: versionCode 3 not found."
            cat "$FILE"
            exit 1
          fi

          if ! grep -q 'versionName = "1.2"' "$FILE"; then
            echo "ERROR: versionName 1.2 not found."
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 3"
          echo "versionName = 1.2"
          echo ""
          echo "NadScan V1.2 verified."

      # ==========================================
      # 10. VERIFY CAMERA PERMISSION
      # ==========================================
      - name: Verify camera configuration
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          SCANNER="$PROJECT_ROOT/app/src/main/java/ae/nadscan/app/ScanActivity.kt"

          echo ""
          echo "========================================"
          echo "CAMERA CHECK"
          echo "========================================"

          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "ERROR:"
            echo "CAMERA permission missing from manifest."
            exit 1
          fi

          if ! grep -q 'RequestPermission' "$SCANNER"; then
            echo "ERROR:"
            echo "Runtime camera permission handling missing."
            exit 1
          fi

          if ! grep -q 'Manifest.permission.CAMERA' "$SCANNER"; then
            echo "ERROR:"
            echo "Runtime CAMERA permission request missing."
            exit 1
          fi

          echo "Manifest CAMERA permission FOUND"
          echo "Runtime CAMERA permission FOUND"
          echo "Camera permission configuration verified."

      # ==========================================
      # 11. VERIFY OFFLINE MODE
      # ==========================================
      - name: Verify offline configuration
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "========================================"
          echo "OFFLINE CHECK"
          echo "========================================"

          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR:"
            echo "INTERNET permission detected."
            exit 1
          fi

          echo "No INTERNET permission."
          echo "NadScan remains offline."

      # ==========================================
      # 12. VERIFY SAFE AREA
      # ==========================================
      - name: Verify Android safe-area handling
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/ae/nadscan/app/MainActivity.kt"
          SCAN="$PROJECT_ROOT/app/src/main/java/ae/nadscan/app/ScanActivity.kt"

          echo ""
          echo "========================================"
          echo "SAFE AREA CHECK"
          echo "========================================"

          grep -q 'WindowInsetsCompat.Type.systemBars' "$MAIN"
          grep -q 'WindowInsetsCompat.Type.systemBars' "$SCAN"

          grep -q 'bars.top' "$MAIN"
          grep -q 'bars.bottom' "$MAIN"

          grep -q 'bars.top' "$SCAN"
          grep -q 'bars.bottom' "$SCAN"

          echo "Home screen top safe area FOUND"
          echo "Home screen bottom safe area FOUND"
          echo "Scanner top safe area FOUND"
          echo "Scanner bottom safe area FOUND"
          echo ""
          echo "Android system-bar protection verified."

      # ==========================================
      # 13. VERIFY NADSCAN ICON
      # ==========================================
      - name: Verify NadScan launcher graphics
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "NADSCAN ICON CHECK"
          echo "========================================"

          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            ICON="$PROJECT_ROOT/app/src/main/res/mipmap-$DENSITY/ic_launcher.png"

            if [ ! -f "$ICON" ]; then
              echo "ERROR:"
              echo "Missing launcher icon:"
              echo "$ICON"
              exit 1
            fi

            echo "$DENSITY icon FOUND"
          done

          echo ""
          echo "Dedicated NadScan launcher graphics verified."

      # ==========================================
      # 14. VERIFY SOURCE FILES
      # ==========================================
      - name: Verify NadScan source files
        shell: bash
        run: |
          set -e

          SOURCE="$PROJECT_ROOT/app/src/main/java/ae/nadscan/app"

          echo ""
          echo "========================================"
          echo "SOURCE CHECK"
          echo "========================================"

          test -f "$SOURCE/MainActivity.kt"
          test -f "$SOURCE/ScanActivity.kt"

          echo "MainActivity.kt FOUND"
          echo "ScanActivity.kt FOUND"

          echo ""
          echo "Layouts:"

          find "$PROJECT_ROOT/app/src/main/res/layout" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ==========================================
      # 15. GRADLE INFO
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 16. CLEAN
      # ==========================================
      - name: Clean NadScan V1.2
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADSCAN V1.2"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 17. BUILD APK
      # ==========================================
      - name: Build NadScan V1.2 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADSCAN V1.2"
          echo "========================================"
          echo "Dedicated NadScan Icon"
          echo "Camera Permission Fix"
          echo "Top Safe Area"
          echo "Bottom Safe Area"
          echo "Offline QR Scanner"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 18. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "LOCATING APK"
          echo "========================================"

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR:"
            echo "NadScan APK was not generated."
            echo ""

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK"
          echo ""

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 19. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadScan V1.2 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadScan-V1.2.apk"

          echo ""
          echo "========================================"
          echo "NADSCAN V1.2 APK READY"
          echo "========================================"

          ls -lh release/NadScan-V1.2.apk

      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload NadScan V1.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadScan-V1-2-APK
          path: release/NadScan-V1.2.apk
          if-no-files-found: error
          retention-days: 30
